{% extends "base.html" %}
{% block title %}{{ code }} error{% endblock %}
{% block body %}
<section class="panel narrow">
  <div class="panel-title"><img src="/static/img/icons/x.png" alt=""> {{ code }} · something went wrong</div>
  <p>{{ message }}</p>
  <div class="actions">
    <a class="btn primary" href="/"><img src="/static/img/icons/home.png" alt="" width="16" height="16"> Back to the dashboard</a>
    <a class="btn" href="/working"><img src="/static/img/icons/truck.png" alt="" width="16" height="16"> Currently working</a>
  </div>
</section>
{% endblock %}
