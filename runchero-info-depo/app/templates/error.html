{% extends "base.html" %}
{% block title %}Not found - {{ site_name }}{% endblock %}

{% block content %}
<div class="panel center" style="padding:40px 20px">
  <img src="{{ static_url('img/icons/depot.png') }}" alt="" style="width:64px;height:64px;image-rendering:pixelated">
  <h1 class="mt">{{ code or 404 }}</h1>
  <p class="muted">{{ message or 'That page could not be found.' }}</p>
  <a class="btn sun" href="/">BACK TO THE YARD</a>
</div>
{% endblock %}
