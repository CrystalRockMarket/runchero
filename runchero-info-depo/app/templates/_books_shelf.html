<details class="panel mb index-group" id="{{ books_anchor }}">
  <summary class="index-summary">
    <img src="{{ static_url('img/icons/book.png') }}" alt="">
    <span class="index-name">{{ books_label|upper }}</span>
    <span class="count">{{ books|length }} books</span>
    <span class="index-arrow" aria-hidden="true">+</span>
  </summary>
  <div class="index-body">
    <p class="small muted">{{ books_intro }}</p>
    <input class="mt" type="search" data-list-filter="{{ books_list_id }}"
           aria-label="{{ books_aria|default('Filter the book list') }}"
           placeholder="{{ books_placeholder|default('Filter books by title or author...') }}">
    <div class="kitchen-book-list mt" data-list="{{ books_list_id }}">
      {% for book in books %}
      <a class="kitchen-book-row" data-filter-text="{{ (book.title ~ ' ' ~ (book.author or '') ~ ' ' ~ (book.year or ''))|lower }}"
         href="/library/archive/{{ book.slug }}">
        <span class="kitchen-book-title">{{ book.title }}</span>
        <span class="kitchen-book-meta">{{ book.author or 'Unknown author' }}{% if book.year %} &middot; {{ book.year }}{% endif %}</span>
        <span class="chip sun">{{ book.format }}</span>
      </a>
      {% else %}
      <div class="empty">No books match that filter.</div>
      {% endfor %}
    </div>
  </div>
</details>
