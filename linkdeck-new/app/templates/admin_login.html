{% raw %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Login – {{ config.PROJECT_NAME }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&family=DM+Mono:wght@500&display=swap">
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
<style>
:root{--bg:#e9eef5;--ink:#101c2e;--mute:#53617a;--paper:#fff;--line:#cdd6e3;--pri:#0b6e7a;--priink:#fff;--gold:#ffc83d;--goldink:#3a2a00;--ok:#127a4b;--bad:#b3261e;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,sans-serif}
h1{font-family:'Bricolage Grotesque',Georgia,serif;line-height:1.08;margin:0}
.admin-login{max-width:400px;margin:48px auto;padding:0 18px}
.admin-login h1{font-size:2.4rem;margin-bottom:8px}
.admin-login p{margin:0 0 26px;color:var(--mute)}
.form{display:grid;gap:14px;background:var(--paper);border-radius:16px;padding:28px;box-shadow:0 0 0 1px var(--line)}
label{display:grid;gap:5px;font-weight:600;font-size:.92rem}
input{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:400 1rem Figtree}
.btn{width:100%;margin-top:8px}
.err{color:var(--bad);font-weight:600;min-height:1.2em;margin:0}
</style>
</head>
<body>
<div class="admin-login">
  <h1>Admin</h1>
  <p>Log in to manage the platform.</p>
  <form class="form" id="f" method="post" action="/auth/login">
    <div class="two">
      <label>Password<input type="password" name="password" placeholder="enter admin password" required></label>
    </div>
    <p class="err" id="er" role="alert"></p>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p style="margin-top:24px;color:var(--mute);font-size:.88rem">Default password is in environment config.</p>
</div>
</body>
</html>{% endraw %}
